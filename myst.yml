version: 1

project:
  title: Machine Learning
  description: >-
    Course materials for the M.Sc. Machine Learning course, Computer Science Dept., Ferdowsi University
    of Mashhad.
  authors:
    - name: Mahmood Amintoosi
  copyright: "2026. CC0 Licensed - Computer Science Dept., Ferdowsi University of Mashhad"
  bibliography:
    - notebooks/references.bib
  # exports:          # Document exports (pdf, docx, ...) are defined here;
    # - format: pdf   # the HTML site is built by `jupyter-book build --html` via the `site:` block below.
  toc:
    - file: notebooks/index.md
    - title: Foundations
      children:
        - file: "notebooks/Introduction.ipynb"
        - file: "notebooks/Local-Models-and-kNN.ipynb"
        - file: "notebooks/Model-Evaluation.ipynb"
        - file: "notebooks/Bias-Variance-Tradeoff.ipynb"
    - title: Simple Methods and High Dimension
      children:
        - file: "notebooks/K-Means-Clustering.ipynb"
        - file: "notebooks/Clustering-Validation.ipynb"
        - file: "notebooks/High-Dimensional-Data.ipynb"
        - file: "notebooks/High-Dimensional-Data-and-kNN.ipynb"
    - title: Linear Models and Neural Networks
      children:
        - file: "notebooks/Linear-Regression-Part1.ipynb"
        - file: "notebooks/Linear-Regression-Part2.ipynb"
        - file: "notebooks/MLP-and-Backpropagation.ipynb"
        - file: "notebooks/MLP-Classification.ipynb"
    - title: Dimensionality Reduction
      children:
        - file: "notebooks/PCA-Part1.ipynb"
        - file: "notebooks/PCA-Part2.ipynb"
        - file: "notebooks/PCA-and-LDA.ipynb"
    - title: Kernel Methods
      children:
        - file: "notebooks/Feature-Map.ipynb"
        - file: "notebooks/Kernel-Trick.md"
        - file: "notebooks/Kernel-Regression.ipynb"
    - title: Bayesian and Statistical Learning
      children:
        - file: "notebooks/MLE-Introduction.md"
        - file: "notebooks/Naive-Bayes.ipynb"
        - file: "notebooks/Mahalanobis-Distance.ipynb"
        - file: "notebooks/Bayesian-Decision-Theory.ipynb"
    - title: Latent Variable Models
      children:
        - file: "notebooks/Gaussian-Mixtures-Part1.ipynb"
        - file: "notebooks/Gaussian-Mixtures-Part2.ipynb"
    - title: Other Topics
      children:
        - file: "notebooks/Data-Preprocessing.ipynb"
        - file: "notebooks/Decision-Trees.ipynb"
        - file: "notebooks/Ensemble-Learning.ipynb"
        - file: "notebooks/Hidden-Markov-Models.ipynb"
        - file: "notebooks/Learning-to-Rank.md"
        - file: "notebooks/Learning-Theory-and-VC.md"
        - file: "notebooks/Advanced-Topics.md"
    - title: Project
      children:
        - file: "notebooks/Project-and-Review.md"
    - title: Appendix
      children:
        - file: notebooks/Appendix-BDT-Discrete-Features.md
        - file: "notebooks/Linear-Models-Advanced-Topics.ipynb" 

site:
  template: book-theme
  github: https://github.com/fum-cs/machine-learning
  options:
    logo: notebooks/img/fum-cs-logo.png
    favicon: notebooks/img/fum-logo.ico
