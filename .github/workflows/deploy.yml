# This file was created automatically with `jupyter-book init --gh-pages` 🪄 💚
# Ensure your GitHub Pages settings for this repository are set to deploy with **GitHub Actions**.

name: Jupyter Book (via myst) GitHub Pages Deploy
on:
  push:
    # Runs on pushes targeting the default branch
    branches: [main]
env:
  # `BASE_URL` determines, relative to the root of the domain, the URL that your site is served from.
  # E.g., if your site lives at `https://mydomain.org/myproject`, set `BASE_URL=/myproject`.
  # If, instead, your site lives at the root of the domain, at `https://mydomain.org`, set `BASE_URL=''`.
  BASE_URL: /${{ github.event.repository.name }}

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x

      # ۲. نصب Jupyter Book 2 (موتور MyST)
      - name: Install Jupyter Book (via myst)
        run: npm install -g jupyter-book

      # ۳. ساخت کتاب
      - name: Build HTML Assets
        run: jupyter-book build --html

      # ۴. کوچک‌کردن آرتیفکت پیش از آپلود
      #    الف) myst برای هر صفحه یک کپی از نوتبوک در build/ می‌گذارد که فقط
      #         لینک «دانلود نوتبوک» به آن اشاره می‌کند؛ حجمش با نوتبوک‌های
      #         دارای خروجی تصویری چند ده مگابایت می‌شود.
      #    ب) اگر زمانی خروجی اسلاید ساخته شود، همان‌جا حذف می‌شود.
      - name: Prune artifact
        run: |
          if [ -d _build/html/build ]; then
            find _build/html/build -maxdepth 1 -name '*.ipynb' -delete
          fi
          rm -rf _build/html/slides
          du -sh _build/html

      # ۵. آپلود خروجی سایت
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './_build/html'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
