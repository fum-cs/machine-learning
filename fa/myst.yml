version: 1

# Persian edition of the course book.
#
# This is a second MyST project inside the same repository: it has its own
# table of contents and its own site options, and it is built separately, with
# the book rooted at /fa/ of the published site:
#
#     cd fa && BASE_URL=/fa jupyter-book build --html
#
# The English pages stay canonical; a Persian page is a translation of one of
# them and keeps the same file name, so `notebooks/x.md` is translated as
# `fa/x.md` and `course-fall-2026/x.md` as `fa/course-fall-2026/x.md`.
# Pages that are not translated yet are simply commented out below.
#
# Everything about the workflow is in docs/bilingual.md.

project:
  title: یادگیری ماشین
  description: >-
    مطالب درس یادگیری ماشین (کارشناسی ارشد)، گروه علوم کامپیوتر، دانشگاه فردوسی مشهد.
  authors:
    - name: محمود امین‌طوسی
  copyright: "۱۴۰۵. پروانهٔ CC0 — گروه علوم کامپیوتر، دانشگاه فردوسی مشهد"
  bibliography:
    # A copy of notebooks/references.bib, because the Persian project cannot
    # read files outside fa/.
    - references.bib
  toc:
    # Generated by tools/sync_fa_toc.py from the English table of contents:
    # an entry is active once the page exists under fa/, commented otherwise.
    - file: index.md
    - title: مبانی
      children:
        - file: Introduction.ipynb
        - file: Local-Models-and-kNN.ipynb
        - file: Clustering-Part1.ipynb
        - file: Linear-Regression-Part1.ipynb
    - title: روش‌های ساده و داده‌های با ابعاد بالا
      children:
        - file: Clustering-Validation.ipynb
        - file: Clustering-Part2.ipynb
        - file: High-Dimensional-Data.ipynb
    - title: مدل‌های خطی و شبکه‌های عصبی
      children:
        - file: Linear-Regression-Part2.ipynb
        - file: MLP-and-Backpropagation.ipynb
    - title: کاهش بُعد
      children:
        - file: PCA-Part1.ipynb
        - file: PCA-Part2.ipynb
        - file: PCA-and-LDA.ipynb
    - title: روش‌های هسته
